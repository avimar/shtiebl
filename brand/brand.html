<!doctype html>
<!-- Source for the channel/newsletter images. Render with: python brand/render.py -->
<html><head><meta charset="utf-8"><style>
  body{margin:0;background:#888;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .dot{border-radius:50%;background:#ff4500;color:#fff;display:grid;place-items:center;font-family:"SBL Hebrew","Frank Ruehl CLM","David",serif;font-weight:700}

  /* 640x640 profile icon: WhatsApp crops it to a circle, so everything stays in the middle */
  #icon{width:640px;height:640px;background:#ff4500;display:grid;place-items:center}
  #icon .he{color:#fff;font-family:"SBL Hebrew","Frank Ruehl CLM","David",serif;font-weight:700;font-size:400px;line-height:1;margin-top:-30px}

  /* 1200x400 email header */
  #banner{width:1200px;height:400px;background:#dae0e6;display:flex;align-items:center;justify-content:center;gap:40px}
  #banner .dot{width:190px;height:190px;font-size:120px;flex-shrink:0}
  #banner h1{margin:0;font-size:110px;font-weight:800;color:#1c1c1c;line-height:1}
  #banner p{margin:12px 0 0;font-size:34px;color:#555}
  #banner .src{margin-top:18px;font-size:24px;color:#0079d3;font-weight:700}
</style></head><body>
<div id="icon"><div class="he">ש</div></div>
<div id="banner">
  <div class="dot">ש</div>
  <div>
    <h1>shtiebl</h1>
    <p>the front page of the beis medrash</p>
    <div class="src">Real Torah as Reddit threads · every line sourced</div>
  </div>
</div>
</body></html>
